<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M7,0 L0,3 L7,6 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="620" fill="#fcfcfa"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1b1b1b">The grants standards architecture</text>
  <text x="40" y="66" font-size="13" fill="#6a6a6a">GRAIN is the grammar; the standards carry the judgment. GRAIN and CROSS work together and apart; WALKRI is separate.</text>

  <!-- descriptive panel -->
  <rect x="30" y="92" width="270" height="430" rx="10" fill="#eef6ee" stroke="#cfe3cf"/>
  <text x="48" y="118" font-size="12" font-weight="700" letter-spacing="1.5" fill="#4c7a4c">DESCRIPTIVE</text>
  <text x="48" y="136" font-size="11" fill="#6f8f6f">names what a grant is made of</text>

  <rect x="58" y="250" width="214" height="132" rx="9" fill="#dcedda" stroke="#7bab77" stroke-width="1.5"/>
  <text x="165" y="284" font-size="20" font-weight="700" text-anchor="middle" fill="#274a26">GRAIN</text>
  <text x="165" y="304" font-size="10.5" text-anchor="middle" fill="#3c5a3b">Grant Representation And</text>
  <text x="165" y="318" font-size="10.5" text-anchor="middle" fill="#3c5a3b">Interchange Notation</text>
  <text x="165" y="342" font-size="11" text-anchor="middle" fill="#274a26">the descriptive grammar of a grant</text>
  <text x="165" y="366" font-size="11" font-weight="600" text-anchor="middle" fill="#274a26">the grant-primitive basis</text>

  <!-- normative panel -->
  <rect x="330" y="92" width="580" height="430" rx="10" fill="#eef1f7" stroke="#d3dbe8"/>
  <text x="348" y="118" font-size="12" font-weight="700" letter-spacing="1.5" fill="#40567e">NORMATIVE</text>
  <text x="348" y="136" font-size="11" fill="#6e7f9e">carries the judgment of whether a grant is sound</text>

  <!-- CRAFT -->
  <rect x="520" y="158" width="210" height="66" rx="9" fill="#dbe3f2" stroke="#7d92c0" stroke-width="1.5"/>
  <text x="625" y="186" font-size="16" font-weight="700" text-anchor="middle" fill="#26304a">CRAFT</text>
  <text x="625" y="205" font-size="10.5" text-anchor="middle" fill="#3b4763">meta-standard: makes a standard checkable</text>

  <!-- Precision-First root -->
  <rect x="345" y="164" width="150" height="54" rx="9" fill="#eae7f2" stroke="#a99fc4" stroke-width="1.3"/>
  <text x="420" y="186" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a3155">Precision-First</text>
  <text x="420" y="202" font-size="10" text-anchor="middle" fill="#524a6e">Design Standard (root)</text>

  <!-- CROSS -->
  <rect x="410" y="300" width="220" height="112" rx="9" fill="#dbe3f2" stroke="#7d92c0" stroke-width="1.5"/>
  <text x="520" y="332" font-size="18" font-weight="700" text-anchor="middle" fill="#26304a">CROSS</text>
  <text x="520" y="352" font-size="10.5" text-anchor="middle" fill="#3b4763">grants obligation standard</text>
  <text x="520" y="372" font-size="10" text-anchor="middle" fill="#5a6a85">(what a grant round must produce)</text>
  <text x="520" y="392" font-size="10" text-anchor="middle" fill="#3b4763">a domain application of CRAFT</text>

  <!-- WALKRI -->
  <rect x="680" y="300" width="210" height="112" rx="9" fill="#dbe3f2" stroke="#7d92c0" stroke-width="1.5"/>
  <text x="785" y="332" font-size="17" font-weight="700" text-anchor="middle" fill="#26304a">WALKRI</text>
  <text x="785" y="352" font-size="10.5" text-anchor="middle" fill="#3b4763">instrument quality at</text>
  <text x="785" y="366" font-size="10.5" text-anchor="middle" fill="#3b4763">the point of data capture</text>
  <text x="785" y="390" font-size="10" text-anchor="middle" fill="#3b4763">domain-agnostic</text>

  <!-- edges -->
  <!-- CROSS -> CRAFT -->
  <line x1="520" y1="300" x2="580" y2="224" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="516" y="266" font-size="9.5" text-anchor="end" fill="#3a3a3a">domain</text>
  <text x="516" y="278" font-size="9.5" text-anchor="end" fill="#3a3a3a">application of</text>

  <!-- WALKRI -> CRAFT -->
  <line x1="785" y1="300" x2="700" y2="224" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="770" y="262" font-size="9.5" text-anchor="start" fill="#3a3a3a">satisfies instrument</text>
  <text x="770" y="274" font-size="9.5" text-anchor="start" fill="#3a3a3a">conditions</text>

  <!-- WALKRI -> Precision-First -->
  <line x1="680" y1="340" x2="495" y2="200" stroke="#7a6fa0" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="560" y="252" font-size="9.5" text-anchor="middle" fill="#6a5f92">content descends from</text>

  <!-- CROSS <-> WALKRI compose -->
  <line x1="630" y1="356" x2="680" y2="356" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
  <text x="655" y="346" font-size="9.5" text-anchor="middle" fill="#3a3a3a">composes with</text>
  <text x="655" y="392" font-size="8.5" text-anchor="middle" fill="#6a6a6a">rigor sandwich</text>

  <!-- GRAIN <-> CROSS instantiate (crosses the boundary) -->
  <line x1="272" y1="316" x2="410" y2="340" stroke="#2f6b2c" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>
  <rect x="286" y="300" width="118" height="30" rx="5" fill="#fcfcfa" opacity="0.85"/>
  <text x="345" y="313" font-size="9.5" text-anchor="middle" fill="#2f6b2c">provisions instantiate</text>
  <text x="345" y="325" font-size="9.5" text-anchor="middle" fill="#2f6b2c">the grammar</text>
  <text x="345" y="360" font-size="9" text-anchor="middle" fill="#6a6a6a">each adoptable alone</text>

  <!-- WALKRI separate from GRAIN note -->
  <rect x="345" y="440" width="545" height="46" rx="7" fill="#f7efef" stroke="#e0c9c9"/>
  <text x="360" y="460" font-size="10.5" font-weight="600" fill="#8a4b4b">WALKRI is separate from GRAIN.</text>
  <text x="360" y="476" font-size="10" fill="#8a4b4b">It references no domain and does not read or consume GRAIN; it meets grant fields only through CROSS.</text>

  <!-- footer -->
  <text x="40" y="560" font-size="11" fill="#4a4a4a">GRAIN is validated by recomposition: the notation is right exactly when every studied grant program decomposes into it and rebuilds from it.</text>
  <text x="40" y="592" font-size="10" fill="#8a8a8a">The two sides are a distinction of kind, not of rank. GRAIN carries no judgment; CROSS, WALKRI, and CRAFT do.</text>
</svg>
